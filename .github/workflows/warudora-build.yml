name: Warudora Forge Build

on:
  push:
    branches:
      - warudora
  workflow_dispatch:

concurrency:
  group: warudora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Assemble Forge mod
        run: bash ./gradlew --no-daemon :forge:compileJava :forge:processResources :forge:jar --stacktrace
